name: Publish models to the web flasher

# Run by hand once the models on master have been reviewed. Builds every model
# and opens a web-flasher pull request with the USDZ and GLB of each.
# Needs a FLASHER_TOKEN secret: a token or GitHub App token that can push
# branches to meshtastic/web-flasher and open pull requests there.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-flasher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build every model
        run: models/build.sh
      - name: Open the web-flasher pull request
        env:
          GH_TOKEN: ${{ secrets.FLASHER_TOKEN }}
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          models/publish-flasher.sh "$RUNNER_TEMP/web-flasher"
